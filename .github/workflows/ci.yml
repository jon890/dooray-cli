name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # setup-node 뒤, 의존성 설치 전에 돈다. Node 는 준비돼 있고 설치만 남아 있다.
      # 공개 저장소라 식별자 노출은 한 번 새면 되돌리기 어렵다.
      - name: Check for exposed identifiers
        run: node scripts/check-pii.mjs

      - name: Check public docs for internal references
        run: node scripts/check-public-refs.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Run build
        run: pnpm build

      - name: Verify package artifact
        run: pnpm verify:package
