name: Claude 코드 리뷰

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.actor != 'dependabot[bot]' &&
      github.actor != 'claude[bot]' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         contains(github.event.comment.body, '/review'))
      )
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    # 같은 PR에 대해 동시에 실행 중인 이전 리뷰 run을 취소하여 중복 코멘트 방지
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      checks: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # /review 댓글 트리거는 PR Checks 탭에 자동 등록되지 않으므로
      # PR head SHA 에 Check Run 을 수동 생성하여 PR 과 workflow 연동
      - name: PR 에 Check Run 등록 (issue_comment 트리거 전용)
        id: check-create
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(gh pr view "${{ env.PR_NUMBER }}" --repo "${{ github.repository }}" \
            --json headRefOid -q .headRefOid)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CHECK_ID=$(gh api "repos/${{ github.repository }}/check-runs" -X POST \
            -f name="Claude 코드 리뷰" \
            -f head_sha="$HEAD_SHA" \
            -f status="in_progress" \
            -f details_url="$RUN_URL" \
            -q .id)
          echo "check_id=$CHECK_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # /review 트리거 댓글에 👀 이모지로 즉시 작업 시작 시그널
      - name: /review 댓글에 시작 reaction 추가
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            --method POST \
            --field content=eyes || true

      - name: 이전 Claude 봇 댓글 삭제
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ env.PR_NUMBER }}"

          # 이전 일반 PR 코멘트 삭제 (claude[bot] 작성)
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .id' \
            | while read -r comment_id; do
              if [ -n "$comment_id" ]; then
                echo "오래된 Claude 일반 댓글 삭제 중: $comment_id"
                gh api "repos/$REPO/issues/comments/$comment_id" --method DELETE || true
              fi
            done

          # 이전 인라인 리뷰 코멘트 삭제 (claude[bot] 작성)
          gh api "repos/$REPO/pulls/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .id' \
            | while read -r comment_id; do
              if [ -n "$comment_id" ]; then
                echo "오래된 Claude 인라인 댓글 삭제 중: $comment_id"
                gh api "repos/$REPO/pulls/comments/$comment_id" --method DELETE || true
              fi
            done

      # 프롬프트는 외부 .txt 로 분리 — YAML heredoc 가독성 + markdown 포맷터의
      # glob/식별자 손상 회피. 변수 치환은 envsubst 로 필요한 것만.
      - name: 리뷰 프롬프트 준비 (외부 .txt → 변수 치환)
        id: prompt
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo 'text<<PROMPT_EOF'
            envsubst '$PR_NUMBER $REPO' < .github/workflows/code-review-prompt.txt
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # 단일 opus 리뷰어 — 일관성·정확도 우선 (4 병렬 specialist 대비).
      # 일반 코드 리뷰 + 프로젝트 특화 4관점을 한 에이전트가 직접 검토.
      - name: Claude 코드 리뷰 실행 (단일 opus 에이전트 + 인라인 리뷰)
        uses: anthropics/claude-code-action@v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: '--model opus --allowedTools "Bash,Read,Grep,Glob" --disallowedTools "Write,Edit"'

      # 게시된 인라인 댓글 중 dummy / 길이 미달 / 마커 부재 entry 를 자동 정리
      # — Claude action 이 자연어 sanity check 를 무시하고 "test body" / "test2"
      # 같은 placeholder 를 게시하는 사고 (PR #114 관측) 를 강제 차단.
      # always 실행해도 안전: 정상 댓글은 패턴에 매치 안 됨.
      - name: 게시된 인라인 댓글의 dummy / 미달 entry 자동 삭제
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ env.PR_NUMBER }}"

          # 필터링은 jq 안에서 수행하고 ID 만 출력 — multi-line body 가 bash
          # `while read` 를 깨뜨리는 사고 방지 (이전 구현은 body 의 개행이 새
          # entry 로 오인되어 garbage id 로 DELETE 폭주, run 시간 9분+ 폭증).
          # 정리 조건 (하나라도 만족하면 삭제):
          #   1) 본문 길이 12자 미만
          #   2) /^test\s*\d*$/i 같은 단순 placeholder (test, test1, sample, foo 등)
          #   3) 🔴 / 🟡 severity 마커 부재 (정상 review 형식 미준수)
          ids=$(gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --jq '
            .[]
            | select(.user.login == "claude[bot]")
            | select(
                (.body | length < 12) or
                (.body | test("^(test|sample|placeholder|foo|bar|example)\\s*[0-9]*$"; "i")) or
                ((.body | test("🔴|🟡")) | not)
              )
            | .id
          ')

          for id in $ids; do
            echo "dummy 인라인 댓글 자동 삭제: id=$id"
            gh api "repos/$REPO/pulls/comments/$id" --method DELETE || true
          done

      # 작업 결과를 /review 댓글에 ✅/❌ reaction 으로 표시 (success/failure 분기, always 실행)
      - name: /review 댓글에 종료 reaction 추가
        if: github.event_name == 'issue_comment' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
        run: |
          # job.status: success | failure | cancelled
          if [ "$OUTCOME" = "success" ]; then
            CONTENT="+1"
          else
            CONTENT="-1"
          fi
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            --method POST \
            --field content="$CONTENT" || true

      # PR Checks 탭에서 결과 확인 가능하도록 Check Run 완료 마킹
      # job.status (success/failure/cancelled) → check-run conclusion 매핑
      - name: Check Run 완료 마킹
        if: github.event_name == 'issue_comment' && always() && steps.check-create.outputs.check_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success)   CONCLUSION="success" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *)         CONCLUSION="failure" ;;
          esac
          gh api "repos/${{ github.repository }}/check-runs/${{ steps.check-create.outputs.check_id }}" -X PATCH \
            -f status="completed" \
            -f conclusion="$CONCLUSION" || true
